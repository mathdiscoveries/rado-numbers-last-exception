fidelity:
  divergences: >-
    None. All claims on mathdiscoveries.org/results/rado-numbers-last-exception
    (both halves of the main theorem for all k >= 3, nu_iff, nu(5) = 66, and
    the k = 3..10 least valid cutoff table) are formalized unconditionally in
    core Lean 4 with exact statement fidelity. Note that nu_iff quantifies over
    all natural-number cutoffs v (giving least integer cutoff c*(k) + 1), while
    requiring Valid nu(k) k (even for even k, matching c*(k) being even when k
    is even) yields the least valid cutoff nu(k) = c*(k) + 1 (odd k) and
    c*(k) + 2 (even k).

