version: "v0.4"

project:
  name: "The Last Exception for Two-Colour Rado Numbers of x + y + c = kz"
  description: >-
    Unconditional pure core Lean 4 formalization (zero external dependencies,
    zero Mathlib imports, zero sorry, zero native_decide, standard axioms only)
    determining the exact last exception c*(k) and threshold nu(k) for the
    2-colour Rado number R(c, k) of x + y + c = kz for every integer k >= 3.
    For odd k, c*(k) = k(k^2 + k - 4)/2 and nu(k) = c*(k) + 1; for even k,
    c*(k) = k(k^2 - 2)/2 and nu(k) = c*(k) + 2, yielding nu(k) = 13, 30, 66,
    104, 183, 250, 388, 492, ... for k = 3..10 and settling the conjecture
    nu(5) = 66 of Kim, Song, and Hwang (2023). Both halves are formalized
    unconditionally: the upper half R(c, k) = LB(c, k) for all valid c > c*(k)
    via a reflection argument x |-> N + 1 - x, and the lower half
    R(c*(k), k) > LB(c*(k), k) (Martinelli and Schaal 2007, Lemma 3).
  authors:
    - "Tyler B. Hughes"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Tyler B. Hughes"

