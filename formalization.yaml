alignment:
  namespace: "RadoNuChallenge"
  statements:
    - source: "Main theorem (both halves, expanded quantifiers): for every k >= 3, R(c, k) = LB(c, k) for every valid c > c*(k) (upper half + Martinelli-Schaal 2007 Lemma 2 lower bound) and non-forcing at [1, LB(c*(k), k)] (boundary colouring)"
      lean: "RadoNuChallenge.rado_last_exception"
      module: "Challenge"
      status: proved
      note: "Unconditional core Lean 4 proof with all quantifiers written out explicitly; second conjunct exhibits a non-monochromatic 2-colouring of [1, LB(c*(k), k)] without claiming finite existence of R(c*(k), k)."
    - source: "Upper half: R(c, k) = LB(c, k) for every k >= 3 and every valid c > c*(k)"
      lean: "RadoNuChallenge.rado_eq_LB"
      module: "Challenge"
      status: proved
      note: "Reflection proof x |-> N + 1 - x of the companion paper (Theorem 1(1)), combined with the Martinelli and Schaal (2007, Lemma 2) lower bound."
    - source: "Boundary colouring: non-forcing at [1, LB(c*(k), k)] for every k >= 3"
      lean: "RadoNuChallenge.not_forced_cstar"
      module: "Challenge"
      status: proved
      note: "Explicit non-monochromatic 2-colourings of [1, LB(c*(k), k)] for odd and even k (proves ¬ Forced (c*(k)) k (LB (c*(k)) k), so c*(k) is an exception; does not formalize finite existence of R(c*(k), k))."
    - source: "Threshold equivalence over all natural-number cutoffs v: R(c, k) = LB(c, k) for all valid c >= v iff c*(k) < v"
      lean: "RadoNuChallenge.nu_iff"
      module: "Challenge"
      status: proved
      note: "Least integer cutoff is c*(k) + 1; restricting to valid cutoffs (Valid nu(k) k, i.e., even for even k) gives least valid cutoff nu(k) = c*(k) + 1 (odd k) and c*(k) + 2 (even k)."
    - source: "Kim-Song-Hwang (2023) conjecture: nu(5) = 66"
      lean: "RadoNuChallenge.nu_5_eq_66"
      module: "Challenge"
      status: proved
      note: "R(c, 5) = LB(c, 5) for all c >= 66, and false for c = 65."
    - source: "Least valid cutoffs nu(k) = c*(k) + 1 (odd k), c*(k) + 2 (even k) = 13, 30, 66, 104, 183, 250, 388, 492 for k = 3..10"
      lean: "RadoNuChallenge.nu_small_values"
      module: "Challenge"
      status: proved
      note: "Direct kernel decide check of the least valid cutoff values (since c*(k) is even for even k, c*(k) + 1 is odd/invalid and c*(k) + 2 is the least valid c > c*(k))."
