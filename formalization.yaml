sources:
  - title: "On Generalized Schur Numbers for x_1 + x_2 + c = kx_3"
    authors:
      - "Bernie Martinelli"
      - "Daniel Schaal"
    type: "paper"
    location: "Ars Combinatoria 85 (2007), 33-42"
    relationship: "formalizes"
    note: >-
      Formalizes Lemma 2 (p. 36), which establishes the general lower bound
      LB(c, k) = ceil((2 ceil((c + 2)/k) + c)/k) for all positive integers c
      and k via a two-block colouring (lower_col / lower in RadoNu/RadoNu.lean).
      Note that Lemma 3 (p. 37) treats negative c; the boundary colouring at
      c*(k) formalized in not_forced_cstar is separate.
    author_endorsement: "not-contacted"
  - title: "The Last Exception for Two-Colour Rado Numbers of x + y + c = kz for Every k >= 3"
    authors:
      - "Tyler B. Hughes"
    id: "https://mathdiscoveries.org/results/rado-numbers-last-exception"
    type: "paper"
    location: "https://mathdiscoveries.org/results/rado-numbers-last-exception"
    relationship: "formalizes"
    note: >-
      The companion paper. It states and proves in writing every compared
      statement of this package (Theorem 1, Corollaries 2 and 3), and the Lean
      work formalizes them; the formalization presents no result that the paper
      does not. The general lower bound LB(c, k) is Lemma 2 of Martinelli and
      Schaal (2007), listed above. Prior results proved here a second time:
      the case k = 3 of Kezdy, Snevily and White (2009) and Theorem 1 of Kim,
      Song and Hwang (2023), listed below. Not found in the literature searches
      logged (arXiv, zbMATH Open, DataCite, CORE, Zenodo, HAL, OSF, GitHub, and
      a 5-query Google Scholar sweep on 2026-11-22; full text of Myers 2015
      thesis and paywalled Kim-Song-Hwang 2026 remain unread [to check]). AI
      research agents built and directed by Tyler B. Hughes generated and
      checked this work. No human mathematician has yet refereed the proof.
    author_endorsement: "participated"
  - title: "Two-color Rado number of x + y + c = kz for large c"
    authors:
      - "Byeong Moon Kim"
      - "Byung Chul Song"
      - "Woonjae Hwang"
    id: "https://doi.org/10.1016/j.disc.2023.113597"
    type: "paper"
    location: "Discrete Mathematics 346 (2023), 113597"
    relationship: "independently-proves"
    note: >-
      Establishes R(c, k) = LB(c, k) above an asymptotic threshold (Theorem 1:
      every k >= 5 and every valid c >= 2k^3 + 2k^2 - k) and poses determining
      the exact threshold nu(k), including the conjecture nu(5) = 66. Theorem 1
      is a case of rado_eq_LB, proved here independently: the companion
      paper's reflection proof does not use it. nu_5_eq_66 settles the
      conjecture.
    author_endorsement: "not-contacted"
  - title: "Two-color Rado numbers for x + y + c = kz"
    authors:
      - "S. Jones"
      - "D. Schaal"
    id: "https://doi.org/10.1016/j.disc.2004.06.022"
    type: "paper"
    location: "Discrete Mathematics 289 (2004), 63-69"
    relationship: "background"
    author_endorsement: "not-contacted"
  - title: "Generalized Schur numbers for x_1 + x_2 + c = 3x_3"
    authors:
      - "A. Kézdy"
      - "H. Snevily"
      - "S. White"
    type: "paper"
    location: "Electronic Journal of Combinatorics 16 (2009), 1-13"
    relationship: "independently-proves"
    note: "Determines the k = 3 case nu(3) = 13, which is the k = 3 entry of nu_small_values and the k = 3 case of rado_eq_LB, proved here independently."
    author_endorsement: "not-contacted"
  - title: "Two-color Rado number for x + y + c = 4z"
    authors:
      - "S. Guo"
    type: "paper"
    location: "Ars Combinatoria 94 (2010), 257-264"
    relationship: "background"
    note: "Shows R(c, 4) = LB(c, 4) for even c >= 34; settles nu(4) = 30 together with the 2023 remark."
    author_endorsement: "not-contacted"

