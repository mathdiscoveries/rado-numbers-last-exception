alignment:
  namespace: "RadoNuChallenge"
  statements:
    - source: "Main theorem (both halves, expanded quantifiers): for every k >= 3, R(c, k) = LB(c, k) for every valid c > c*(k) and R(c*(k), k) > LB(c*(k), k)"
      lean: "RadoNuChallenge.rado_last_exception"
      module: "Challenge"
      status: proved
      note: "Unconditional core Lean 4 proof with all quantifiers written out explicitly."
    - source: "Upper half: R(c, k) = LB(c, k) for every k >= 3 and every valid c > c*(k)"
      lean: "RadoNuChallenge.rado_eq_LB"
      module: "Challenge"
      status: proved
      note: "Original reflection proof x |-> N + 1 - x combined with Martinelli-Schaal lower bound."
    - source: "Lower half (Martinelli-Schaal Lemma 3): c*(k) is an exception for every k >= 3"
      lean: "RadoNuChallenge.not_forced_cstar"
      module: "Challenge"
      status: proved
      note: "Explicit non-monochromatic 2-colourings of [1, LB(c*(k), k)] for odd and even k."
    - source: "Threshold equivalence: R(c, k) = LB(c, k) for all valid c >= v iff c*(k) < v"
      lean: "RadoNuChallenge.nu_iff"
      module: "Challenge"
      status: proved
      note: "Determines nu(k) = c*(k) + 1 (odd k) and c*(k) + 2 (even k) for all k >= 3."
    - source: "Kim-Song-Hwang (2023) conjecture: nu(5) = 66"
      lean: "RadoNuChallenge.nu_5_eq_66"
      module: "Challenge"
      status: proved
      note: "R(c, 5) = LB(c, 5) for all c >= 66, and false for c = 65."
    - source: "Exact small values nu(k) = 13, 30, 66, 104, 183, 250, 388, 492 for k = 3..10"
      lean: "RadoNuChallenge.nu_small_values"
      module: "Challenge"
      status: proved
      note: "Direct kernel decide check."
