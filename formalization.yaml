status:
  scope: >-
    Complete, unconditional proof of both halves of the exact last-exception
    characterization for every integer k >= 3 in pure core Lean 4 (zero Mathlib
    imports, 68 verified declarations): (1) the companion paper's reflection proof of the
    upper half R(c, k) = LB(c, k) for every valid c > c*(k) (where Valid c k
    means k odd or c even), combined with Martinelli and Schaal's (2007,
    Lemma 2) general lower bound LB(c, k); (2) explicit boundary colourings
    establishing non-forcing at LB(c*(k), k), i.e.,
    ¬ Forced (c*(k)) k (LB (c*(k)) k), via non-monochromatic 2-colourings of
    [1, LB(c*(k), k)] for odd and even k (so c*(k) fails
    IsRado (c*(k)) k (LB (c*(k)) k); finite existence of R(c*(k), k) itself is
    not formalized); (3) the threshold equivalence nu_iff showing that
    "R(c, k) = LB(c, k) for all valid c >= v" holds iff c*(k) < v (so the
    least integer cutoff is c*(k) + 1, while the least valid cutoff nu(k)
    satisfying Valid nu(k) k is c*(k) + 1 for odd k and c*(k) + 2 for even k),
    exact least valid cutoffs for k = 3..10, and the Kim-Song-Hwang (2023)
    conjecture nu(5) = 66. Does not determine individual Rado numbers R(c, k)
    for exceptions c <= c*(k) or formalize finite existence of R(c*(k), k).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]

