version: "v0.4"

project:
  name: "The Last Exception for Two-Colour Rado Numbers of x + y + c = kz"
  description: >-
    Unconditional pure core Lean 4 formalization (zero external dependencies,
    zero Mathlib imports, zero sorry, zero native_decide, standard axioms only)
    determining the exact last exception c*(k) for the 2-colour Rado number
    R(c, k) of x + y + c = kz for every integer k >= 3, where c*(k) =
    k(k^2 + k - 4)/2 for odd k and k(k^2 - 2)/2 for even k. Both halves are
    formalized unconditionally: (1) the companion paper's reflection proof
    (x |-> N+1-x) of the upper half R(c, k) = LB(c, k) for every valid c > c*(k) (valid means
    k odd or c even) combined with the general lower bound LB(c, k) of
    Martinelli and Schaal (2007, Lemma 2), and (2) an explicit boundary
    colouring showing non-forcing at LB(c*(k), k), i.e., there exists a
    2-colouring of [1, LB(c*(k), k)] with no monochromatic solution of
    x + y + c*(k) = k z (so ¬ Forced (c*(k)) k (LB (c*(k)) k) and c*(k) is an
    exception to R(c, k) = LB(c, k); finite existence of R(c*(k), k) itself is
    not formalized). In nu_iff, the property "R(c, k) = LB(c, k) for all valid
    c >= v" holds iff c*(k) < v, so the least integer cutoff is c*(k) + 1
    while the least valid cutoff nu(k) (requiring Valid nu(k) k, i.e., even
    when k is even) is c*(k) + 1 for odd k and c*(k) + 2 for even k, giving
    least valid cutoffs 13, 30, 66, 104, 183, 250, 388, 492 for k = 3..10 and
    settling the Kim-Song-Hwang (2023) conjecture nu(5) = 66.
  authors:
    - "Tyler B. Hughes"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Tyler B. Hughes"

